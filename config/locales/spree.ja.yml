        title: タイトル
        fit: に収める。
        info_hero_image_body: "<p>ヒーローイメージセクションは、大きな画像とボタン、タグラインのテキストをページに追加します。</p>
          <p>ボタンは、商品、分類、またはページにリンクさせることができます。ヒーローイメージセクションは、中央コンテナに収めるか、画面の端まで広げるかを設定できます。</p>
          <p><b>ヒント:</b> ボタンテキストやタイトルを使わずにヒーローイメージを設定し、その後<b>横表示:</b>を<b>コンテナ</b>に設定し、<b>ガター</b>を<b>ガターを使用</b>に設定すると、サイドバイサイドイメージセクションやイメージギャラリーセクションの上に配置され、見栄えの良い画像セクションが作成できます。</p>
          <p>設定をいろいろお試していただき、1ページに複数のヒーローイメージセクションを使うことも是非お試しください。</p>"
        info_image_gallery_body: "<p>イメージギャラリーセクションの設定には複数の方法があります。たとえば、各画像に商品や分類へのリンクを設定することが可能です。リンクを設定しない場合は、3枚の画像を表示することができます。さらに、ラベルを使って画像にテキストを追加することも可能です。</p>
          <p>イメージギャラリーセクションには、左側もしくは右側に背の高い画像を配置する2種のレイアウト設定があります。イメージギャラリーセクションはウェブサイトのスタイルに合わせて、画面の端まで広げることも、中央コンテナに収めることもできます。</p>"
        info_product_carousel_body: "<p>商品カルーセルは簡単にご利用いただくことができるセクションです。表示したい分類を検索いただき変更を保存すると、選択した分類の商品がページに表示されます。"
        info_featured_article_body: "</p> <p>特集記事セクションでは、設定されたタイトル・サブタイトル・リンクボタンで、リッチテキストをページに追加することができます。</p>
          <p>特集記事セクションは、フルスクリーンまたはコンテナを使用するよう設定することができ、また、ガターも使用することができます。"
        info_side_by_side_images_body: "<p>サイドバイサイドイメージセクションの設定には複数の方法があります。平面的な画像として使用することもテキスト付きの画像として使用することもでき、どちらのオプションでもリンクを設定すればクリックできるようになります。</p>
          <p><b>ヒント:</b> これらの画像を画面の端まで広げ、ガターを取り除くことで、まったく異なる見た目を作成できます。</p>"
        info_rich_text_content_body: "<p>リッチテキストコンテンツセクションは、ページに表示するためのリッチテキストエディタのコンテンツエリアを提供するのみのセクションです。</p>"
